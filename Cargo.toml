[workspace]
members = [
  "crates/tethercraft-core",
  "crates/tethercraft-proto",
  "crates/tethercraft-net",
  "crates/tethercraft-capture",
  "crates/tethercraft-codec",
  "crates/tethercraft-input",
  "crates/tethercraft-host",
  "crates/tethercraft-server",
  "crates/tethercraft-store",
  "crates/tethercraft-mcp",
  "crates/tethercraft-app",
  "crates/tethercraft-probe",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["TetherCraft contributors"]
rust-version = "1.78"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["use-std"] }
ed25519-dalek = "2.1"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
spake2 = "0.4"
argon2 = "0.5"
chacha20poly1305 = "0.10"
quinn = "0.11"
rustls = "0.23"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "2.0"
eframe = "0.32"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.lints.rust]
unsafe_code = "warn"
